name: Update open source contributions

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/contributions.yml'

permissions:
  contents: write

concurrency:
  group: update-contributions
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'IgorDaniel45/IgorDaniel45' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test generator
        run: node --test .github/scripts/contributions.test.mjs
      - name: Update contribution list
        run: node .github/scripts/contributions.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changes
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md
          git commit -m 'docs: update open source contributions'
          git push origin HEAD:main
